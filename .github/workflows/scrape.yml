name: hourly snapshot

on:
  schedule:                    # GitHub's cron is best-effort (overnight 2026-09-28 it ran every 4–6 h,
    - cron: "7 * * * *"        # not hourly), so we ask several times an hour and rely on the
    - cron: "27 * * * *"       # external hourly dispatch (cron-job.org) as the real clock.
    - cron: "47 * * * *"       # capture.py paces the credit budget, so extra runs cost nothing.
  workflow_dispatch:           # manual runs from the Actions tab and the external dispatcher
  repository_dispatch:
    types: [tick]

permissions:
  contents: write

concurrency:
  group: snapshot          # never let two hourly runs overlap or race on the CSV commits
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: snapshot both sources
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python scrape.py

      - name: resale listing captures (budgeted)
        env:
          TICKETSDEV_API_KEY: ${{ secrets.TICKETSDEV_API_KEY }}
        run: python capture.py

      - name: commit new rows
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
