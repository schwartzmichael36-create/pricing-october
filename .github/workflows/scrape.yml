name: hourly snapshot

on:
  schedule:
    - cron: "33 * * * *"       # backup only. The real hourly clock is cron-job.org (dispatch at :00);
                               # GitHub's cron is best-effort and ran every 4–6 h on 2026-09-28.
                               # More triggers than this queued runs that overspent the budget.
  workflow_dispatch:           # manual runs from the Actions tab and the external dispatcher
  repository_dispatch:
    types: [tick]

permissions:
  contents: write

concurrency:
  group: snapshot          # never let two hourly runs overlap or race on the CSV commits
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: latest data (a queued run checks out the commit it was triggered at, not HEAD)
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: snapshot both sources
        continue-on-error: true      # one flaky API must not stop the captures and the commit
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python scrape.py

      - name: resale listing captures (budgeted)
        env:
          TICKETSDEV_API_KEY: ${{ secrets.TICKETSDEV_API_KEY }}
        run: python capture.py

      - name: commit new rows
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing new to commit"; exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved (a code push, another run): rebase our one commit and retry
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed; retrying"; sleep 10
          done
          git status; git log --oneline -3; exit 1
